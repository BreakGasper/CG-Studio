# Publica la página en Firebase Hosting (https://cg-studio-1d248.web.app) SIN llaves de cuenta
# de servicio: GitHub se autentica con Google mediante Workload Identity Federation.
# Se ejecuta al subir cambios a `main` y a mano desde Actions → Run workflow (eligiendo rama).
#
# Requiere dos variables en GitHub (Settings → Secrets and variables → Actions → Variables):
#   GCP_WIF_PROVIDER     projects/<NUMERO>/locations/global/workloadIdentityPools/github/providers/github-provider
#   GCP_SERVICE_ACCOUNT  github-deployer@cg-studio-1d248.iam.gserviceaccount.com
# (los comandos para crearlas están en el README).
name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: |
          echo "tipo de credencial:"; python3 -c "import json,os;d=json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']));print(d.get('type'), list(d.keys()))"
          npx --yes firebase-tools@latest deploy --only hosting --project cg-studio-1d248 --non-interactive --debug
