# Publica la página en Firebase Hosting (https://cg-studio-1d248.web.app).
# Se ejecuta al subir cambios a `main` y también a mano desde la pestaña Actions
# (botón "Run workflow", eligiendo la rama que quieras publicar).
#
# Requiere un secreto en GitHub: FIREBASE_SERVICE_ACCOUNT (ver README, sección "Deploy desde GitHub").
name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cg-studio-1d248
          channelId: live
